apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-demo-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://example.com/your/repo.git
    targetRevision: main
    path: deploy/chart
    helm:
      valueFiles:
        - values.yaml
        - ../local/values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hello-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
